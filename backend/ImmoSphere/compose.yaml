
dotnet user-secrets init --project .\ImmoSphere.Apiservices:
  postgres:
    image: postgres:17
    container_name: immosphere-postgres
    environment:
      POSTGRES_DB: immosphere_dev
      POSTGRES_USER: immosphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
