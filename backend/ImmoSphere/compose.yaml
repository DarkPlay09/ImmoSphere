
services:
  mailpit:
      image: axllent/mailpit:latest
      container_name: immosphere-mailpit
      ports:
        - "127.0.0.1:8025:8025"
        - "127.0.0.1:1025:1025"
      restart: unless-stopped
  postgres:
    image: postgres:17
    container_name: immosphere-postgres
    environment:
      POSTGRES_DB: immosphere_dev
      POSTGRES_USER: immosphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:


  