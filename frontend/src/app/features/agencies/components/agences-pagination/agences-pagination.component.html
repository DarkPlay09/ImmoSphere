<nav class="agences-pagination" [attr.aria-label]="'agences.pagination.label' | translate">
  <button
    type="button"
    class="agences-pagination__nav"
    [disabled]="page() === 1"
    (click)="goTo(page() - 1)"
  >
    <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    {{ 'agences.pagination.previous' | translate }}
  </button>

  @for (item of items(); track $index) {
    @if (item === 'ellipsis') {
      <span class="agences-pagination__ellipsis" aria-hidden="true">…</span>
    } @else {
      <button
        type="button"
        class="agences-pagination__page"
        [class.agences-pagination__page--active]="item === page()"
        [attr.aria-current]="item === page() ? 'page' : null"
        [attr.aria-label]="'agences.pagination.page' | translate: { page: item }"
        (click)="goTo(item)"
      >
        {{ item }}
      </button>
    }
  }

  <button
    type="button"
    class="agences-pagination__nav"
    [disabled]="page() === pageCount()"
    (click)="goTo(page() + 1)"
  >
    {{ 'agences.pagination.next' | translate }}
    <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
  </button>
</nav>
