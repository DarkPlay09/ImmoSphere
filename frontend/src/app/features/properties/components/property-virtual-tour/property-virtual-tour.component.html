<section class="virtual-tour" aria-labelledby="virtual-tour-title">
  <header class="virtual-tour__header">
    <div>
      <h2 id="virtual-tour-title">{{ 'propertyDetail.virtualTour.title' | translate }}</h2>
      <p>{{ 'propertyDetail.virtualTour.description' | translate }}</p>
    </div>

    <span class="virtual-tour__status">{{ 'propertyDetail.common.comingSoon' | translate }}</span>
  </header>

  <div class="virtual-tour__preview">
    <div class="virtual-tour__marker" aria-hidden="true">
      <img src="icons/property-detail/virtual-tour.svg" alt="" />
    </div>
    <p>{{ 'propertyDetail.virtualTour.placeholder' | translate }}</p>
  </div>
</section>
