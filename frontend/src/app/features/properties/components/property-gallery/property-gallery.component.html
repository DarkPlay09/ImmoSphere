<section
  class="gallery"
  [class.gallery--single]="orderedImages().length === 1"
  [class.gallery--double]="orderedImages().length === 2"
  [attr.aria-label]="'propertyDetail.gallery.label' | translate"
>
  @if (orderedImages().length > 0) {
    @for (image of orderedImages().slice(0, 5); track image.url; let index = $index) {
      <figure class="gallery__item" [class.gallery__item--main]="index === 0">
        <img [src]="image.url" [alt]="image.texteAlternatif" />
      </figure>
    }

    <div class="gallery__actions">
      <button
        type="button"
        class="gallery__action"
        [attr.aria-label]="'propertyDetail.gallery.share' | translate"
        (click)="share()"
      >
        <img src="icons/property-detail/share.svg" alt="" />
      </button>
      <button
        type="button"
        class="gallery__action"
        [class.gallery__action--active]="favorite()"
        [attr.aria-pressed]="favorite()"
        [attr.aria-label]="'propertyDetail.gallery.favorite' | translate"
        (click)="toggleFavorite()"
      >
        <span class="gallery__favorite-icon" aria-hidden="true"></span>
      </button>
    </div>

    <button type="button" class="gallery__count">
      <img src="icons/property-detail/gallery.svg" alt="" />
      {{
        (orderedImages().length === 1
          ? 'propertyDetail.gallery.photoCountOne'
          : 'propertyDetail.gallery.photoCount'
        ) | translate: { count: orderedImages().length }
      }}
    </button>
  } @else {
    <div class="gallery__empty">
      <span>{{ 'propertyDetail.gallery.empty' | translate }}</span>
    </div>
  }
</section>
