<app-auth-shell>
  <section
    class="forgot-password"
    aria-labelledby="forgot-password-title"
  >
    <header class="forgot-password__heading">
      <h1 id="forgot-password-title">
        {{ 'auth.forgotPassword.title' | translate }}
      </h1>

      <p>
        {{ 'auth.forgotPassword.subtitle' | translate }}
      </p>
    </header>

    <form
      class="forgot-password__form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <div class="forgot-password__field">
        <label for="forgot-email">
          {{ 'auth.forgotPassword.email' | translate }}
        </label>

        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          [placeholder]="
            'auth.forgotPassword.emailPlaceholder' | translate
          "
          [attr.aria-invalid]="showError()"
          [attr.aria-describedby]="
            showError() ? 'forgot-email-error' : null
          "
        />

        @if (showError()) {
          <span
            id="forgot-email-error"
            class="forgot-password__error"
            role="alert"
          >
            {{
              (form.controls.email.hasError('email')
                ? 'auth.login.errors.email'
                : 'auth.login.errors.required') | translate
            }}
          </span>
        }
      </div>

      <button
        type="submit"
        class="forgot-password__submit"
      >
        {{ 'auth.forgotPassword.submit' | translate }}

        <span
          class="material-symbols-outlined"
          aria-hidden="true"
        >
          send
        </span>
      </button>
    </form>

    <div class="forgot-password__actions">
      <a routerLink="/login">
        <span
          class="material-symbols-outlined"
          aria-hidden="true"
        >
          arrow_back
        </span>

        {{ 'auth.forgotPassword.backToLogin' | translate }}
      </a>
    </div>
  </section>
</app-auth-shell>
