<footer class="footer">
  <div class="footer__container">
    <div class="footer__columns">

      <section class="footer__group">
        <h2 class="footer__heading">{{ 'footer.properties.title' | translate }}</h2>

        <ul class="footer__links">
          <li>
            <a routerLink="/properties" [queryParams]="{ transaction: 'sale' }">
              {{ 'navbar.buy' | translate }}
            </a>
          </li>
          <li>
            <a routerLink="/properties" [queryParams]="{ transaction: 'rent' }">
              {{ 'navbar.rent' | translate }}
            </a>
          </li>
        </ul>
      </section>

    </div>
  </div>
</footer>
