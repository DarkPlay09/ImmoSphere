<header class="navbar">
  <nav class="navbar__navigation" aria-label="Navigation principale">
    <a class="navbar__logo" routerLink="/properties">
      <img
        src="logo/logo-immosphere.png"
        alt="ImmoSphere — accueil des biens"
      />
    </a>

    <ul class="navbar__links">
      @for (link of navigationLinks; track link.id){
        <li>
          @if (link.route){
            <a
              class="navbar__link"
              [routerLink]="link.route"
              [queryParams]="link.queryParams"
            >
              {{ link.label }}
            </a>
          } @else {
            <span
              class="navbar__link navbar__link--disabled"
              aria-disabled="true"
            >
              {{ link.label }}
            </span>
          }
        </li>
      }
    </ul>
    <div class="navbar__actions">
      <button
        class="navbar__favorites"
        type="button"
        [attr.aria-label]="
      isLoggedIn()
        ? 'Mes favoris : ' + favoritesCount()
        : 'Mes favoris'
    "
      >
        <img src="icons/heart.svg" alt="" />

        @if (isLoggedIn()) {
          <span class="navbar__favorites-count" aria-hidden="true">
        {{ favoritesCount() }}
      </span>
        }
      </button>

      <div class="navbar__language">
        <img src="icons/globe.svg" alt="" />

        <span class="navbar__language-code" aria-hidden="true">
          {{ language() }}
        </span>

        <img src="icons/chevron-down.svg" alt="" />

        <select
          #languageSelect
          class="navbar__language-select"
          aria-label="Langue du site"
          [value]="language()"
          (change)="changeLanguage(languageSelect.value)"
        >
          @for (option of languages; track option.code) {
            <option [value]="option.code">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

    </div>
  </nav>
</header>
