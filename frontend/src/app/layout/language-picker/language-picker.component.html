<app-select
  [options]="options"
  [value]="language()"
  [label]="'navbar.languageWithCode' | translate: { code: language().toUpperCase() }"
  [placement]="variant() === 'footer' ? 'above' : 'below'"
  (valueChange)="selectLanguage($event)"
>
  <span selectTrigger class="language-picker__label">
    @if (variant() === 'navbar') {
      <img src="icons/globe.svg" alt="" />
      {{ language().toUpperCase() }}
    } @else {
      <span [attr.lang]="language()">
        {{ ('navbar.languages.' + language()) | translate }}
      </span>
    }
  </span>
</app-select>
