<article class="faq-item" [class.faq-item--open]="expanded()">
  <h3 class="faq-item__heading">
    <button
      type="button"
      class="faq-item__toggle"
      [id]="toggleId()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="answerId()"
      (click)="toggle()"
    >
      <span class="faq-item__question">{{ item().question }}</span>
      <span class="faq-item__arrow" [class.faq-item__arrow--open]="expanded()" aria-hidden="true">
        <span class="faq-item__arrow-icon"></span>
      </span>
    </button>
  </h3>

  <div
    class="faq-item__panel"
    role="region"
    [id]="answerId()"
    [attr.aria-labelledby]="toggleId()"
    [hidden]="!expanded()"
  >
    <p class="faq-item__answer">{{ item().answer }}</p>
    <app-faq-answer-rating class="faq-item__rating" [questionId]="item().id" />
  </div>
</article>
